<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1e293b" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#334155"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)" opacity="0.6"/>

  <!-- Technical Accents / Engineering Schematics -->
  <g opacity="0.25">
    <circle cx="1120" cy="180" r="130" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="1120" cy="180" r="90" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="1120" cy="180" r="40" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="940" y1="180" x2="1260" y2="180" stroke="#334155" stroke-width="1.5"/>
    <line x1="1120" y1="20" x2="1120" y2="340" stroke="#334155" stroke-width="1.5"/>
    <!-- Schematic Nodes -->
    <circle cx="1120" cy="90" r="4" fill="#0ea5e9"/>
    <circle cx="1120" cy="270" r="4" fill="#0ea5e9"/>
    <circle cx="1030" cy="180" r="4" fill="#10b981"/>
    <circle cx="1210" cy="180" r="4" fill="#10b981"/>
  </g>

  <!-- Glow effect -->
  <circle cx="1120" cy="180" r="90" fill="#0ea5e9" opacity="0.08" filter="url(#glow)"/>

  <!-- Content -->
  <g transform="translate(80, 0)">
    <!-- Header Tag -->
    <rect x="0" y="55" width="280" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="16" cy="69" r="4" fill="#10b981"/>
    <text x="30" y="73" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" letter-spacing="1.5">MECATRÔNICA &amp; EMBARCADOS</text>

    <!-- Main Title -->
    <text x="0" y="150" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Georlan Júnior</text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Engenharia Mecatrônica • Eletrônica de Potência • Controle &amp; Firmware</text>

    <!-- Divider -->
    <rect x="0" y="222" width="620" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- Disciplines -->
    <text x="0" y="270" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="0.5">Hardware (KiCad)  •  Firmware (C/C++ / PlatformIO)  •  Controle &amp; Simulação (Python / SPICE)</text>
    <text x="0" y="300" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Instituto Federal do Ceará (IFCE) — Campus Limoeiro do Norte</text>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1278" height="358" rx="15" stroke="#1e293b" stroke-width="2"/>
</svg>
