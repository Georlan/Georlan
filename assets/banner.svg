<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="engGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6"/>
      <circle cx="30" cy="30" r="0.75" fill="#334155"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="300" rx="14" fill="url(#bgGradient)"/>
  <rect width="1200" height="300" rx="14" fill="url(#engGrid)"/>

  <!-- Right Visual: Engineering Blueprint & Feedback Dynamics -->
  <g transform="translate(760, 0)">
    <!-- Ambient Glow Behind Mechanism -->
    <circle cx="240" cy="150" r="100" fill="#06B6D4" opacity="0.06" filter="url(#softGlow)"/>

    <!-- PCB & Bus Routing Traces -->
    <path d="M 40 70 L 140 70 L 170 100 L 290 100" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <path d="M 60 230 L 130 230 L 160 200 L 320 200" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="70" r="3" fill="#334155"/>
    <circle cx="290" cy="100" r="3" fill="#06B6D4" opacity="0.8"/>
    <circle cx="60" cy="230" r="3" fill="#334155"/>
    <circle cx="320" cy="200" r="3" fill="#10B981" opacity="0.8"/>

    <!-- Control Loop / Rotor Dial -->
    <circle cx="240" cy="150" r="95" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="240" cy="150" r="75" stroke="#06B6D4" stroke-width="1.5" opacity="0.4"/>
    <circle cx="240" cy="150" r="48" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

    <!-- Dial Tick Marks -->
    <line x1="240" y1="50" x2="240" y2="60" stroke="#38BDF8" stroke-width="2"/>
    <line x1="240" y1="240" x2="240" y2="250" stroke="#38BDF8" stroke-width="2"/>
    <line x1="140" y1="150" x2="150" y2="150" stroke="#38BDF8" stroke-width="2"/>
    <line x1="330" y1="150" x2="340" y2="150" stroke="#38BDF8" stroke-width="2"/>

    <!-- Vector Angle & State Vectors -->
    <path d="M 240 150 L 295 105" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="295" cy="105" r="4" fill="#10B981"/>
    <circle cx="240" cy="150" r="5" fill="#F8FAFC"/>

    <!-- Mathematical Formula / Transfer Function Block -->
    <rect x="70" y="125" width="90" height="50" rx="8" fill="#0B1120" stroke="#06B6D4" stroke-width="1.2" opacity="0.85"/>
    <text x="115" y="155" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" font-weight="600" text-anchor="middle">G(s)</text>
    <path d="M 30 150 L 70 150" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 160 150 L 195 150" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Technical Annotations -->
    <text x="290" y="85" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">θ(t), ω(t)</text>
    <text x="75" y="112" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CONTROLE</text>
    <text x="210" y="275" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">FEEDBACK LOOP</text>
  </g>

  <!-- Left Content: Profile Info -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Institution -->
    <g transform="translate(0, 42)">
      <rect width="250" height="26" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
      <text x="26" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">IFCE • MECATRÔNICA INDUSTRIAL</text>
    </g>

    <!-- Name Headline -->
    <text x="0" y="118" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">GEORLAN JÚNIOR</text>

    <!-- Subtitle -->
    <text x="0" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="500">Engenharia Mecatrônica  •  Eletrônica de Potência  •  Controle &amp; Firmware</text>

    <!-- Color Accent Bar -->
    <rect x="0" y="174" width="420" height="2.5" rx="1.25" fill="url(#accentGradient)"/>

    <!-- Discipline Badges -->
    <g transform="translate(0, 202)">
      <!-- Badge 1: Potência -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="67" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">⚡ Potência / KiCad</text>

      <!-- Badge 2: Firmware -->
      <rect x="145" y="0" width="145" height="28" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="217" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">📟 Firmware / C++</text>

      <!-- Badge 3: Controle -->
      <rect x="300" y="0" width="140" height="28" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="370" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">⚙️ Controle / Python</text>

      <!-- Badge 4: CAD -->
      <rect x="450" y="0" width="125" height="28" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="512" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">📐 CAD / FreeCAD</text>
    </g>

    <!-- Location footer -->
    <text x="0" y="268" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Limoeiro do Norte, Ceará, Brasil</text>
  </g>

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="298" rx="13" stroke="#1E293B" stroke-width="1.5"/>
</svg>
